name: Build Alioth Kernel (DroidSpaces + KernelSU)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Install Build Dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential bc bison flex libssl-dev git libelf-dev python3 zip gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

      - name: Setup Proton Clang
        run: |
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git clang

      - name: Clone LineageOS SM8250 Kernel
        run: |
          git clone --depth=1 https://github.com/LineageOS/android_kernel_xiaomi_sm8250.git -b lineage-22.2 kernel

      - name: Setup KernelSU
        run: |
          cd kernel
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -

      - name: Configure Kernel (DroidSpaces, KSU & Fix VDSO)
        run: |
          cd kernel
          export ARCH=arm64
          export SUBARCH=arm64

          # Отключаем сбойный vdso32 в исходном дефконфиге
          sed -i 's/CONFIG_COMPAT_VDSO=y/# CONFIG_COMPAT_VDSO is not set/' arch/arm64/configs/vendor/alioth_defconfig

          # Генерируем базовый .config
          make O=out vendor/alioth_defconfig

          # Отключаем COMPAT_VDSO и применяем параметры DroidSpaces + KSU через kconfig
          ./scripts/config --file out/.config \
            --disable COMPAT_VDSO \
            --enable KSU \
            --enable SYSVIPC \
            --enable POSIX_MQUEUE \
            --enable NAMESPACES \
            --enable UTS_NS \
            --enable IPC_NS \
            --enable PID_NS \
            --enable NET_NS \
            --enable USER_NS \
            --enable CGROUPS \
            --enable CGROUP_PIDS \
            --enable CGROUP_DEVICE \
            --enable CGROUP_FREEZER \
            --enable CPUSETS \
            --enable DEVTMPFS \
            --enable DEVTMPFS_MOUNT \
            --enable VETH \
            --enable BRIDGE \
            --enable NETFILTER_XT_MATCH_ADDRTYPE

          # Валидируем итоговый конфиг
          make O=out olddefconfig

      - name: Compile Kernel Image
        run: |
          cd kernel
          export PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64
          
          # Собираем ядро без форсирования LLVM_IAS во избежание сбоев ассемблера 4.19
          make -j$(nproc) O=out \
            CC=clang \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            Image

      - name: Package with AnyKernel3
        run: |
          git clone https://github.com/osm0sis/AnyKernel3.git ak3
          cd ak3
          cp ../kernel/out/arch/arm64/boot/Image .
          sed -i 's/device.name1=.*/device.name1=alioth/' anykernel.sh
          sed -i 's/device.name2=.*/device.name2=aliothin/' anykernel.sh
          zip -r9 ../AnyKernel3-Alioth-DroidSpaces-KSU.zip * -x .git README.md *placeholder

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AnyKernel3-Alioth-DroidSpaces-KSU
          path: AnyKernel3-Alioth-DroidSpaces-KSU.zip
