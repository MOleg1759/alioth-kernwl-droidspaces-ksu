name: Build Alioth Kernel (DroidSpaces + KernelSU)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Install Build Dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential bc bison flex libssl-dev git libelf-dev python3 python-is-python3 zip cpio gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

      - name: Setup Proton Clang
        run: |
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git clang

      - name: Clone LineageOS SM8250 Kernel
        run: |
          git clone --depth=1 https://github.com/LineageOS/android_kernel_xiaomi_sm8250.git -b lineage-22.2 kernel

      - name: Setup KernelSU
        run: |
          cd kernel
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -

      - name: Configure Kernel (DroidSpaces, KSU & Fix VDSO)
        run: |
          cd kernel
          export ARCH=arm64
          export SUBARCH=arm64

          # 1. Создаем выходной каталог для merge_config.sh и make
          mkdir -p out

          # 2. Отключаем COMPAT_VDSO во всех найденных конфигах дерева
          find arch/arm64/configs -type f \( -name "*defconfig*" -o -name "*.config" \) -exec sed -i 's/CONFIG_COMPAT_VDSO=y/# CONFIG_COMPAT_VDSO is not set/' {} +

          # 3. Находим базовый дефконфиг Kona и фрагменты Xiaomi/Alioth
          DEFCONFIG_BASE="arch/arm64/configs/vendor/kona-perf_defconfig"
          COMMON_CONFIG=$(find arch/arm64/configs -name "sm8250-common.config" | head -n 1)
          ALIOTH_CONFIG=$(find arch/arm64/configs -name "alioth.config" | head -n 1)

          echo "Используется база: $DEFCONFIG_BASE"
          echo "Используется common: $COMMON_CONFIG"
          echo "Используется alioth: $ALIOTH_CONFIG"

          # 4. Объединяем конфигурации
          ARCH=arm64 ./scripts/kconfig/merge_config.sh -O out \
            "$DEFCONFIG_BASE" \
            ${COMMON_CONFIG:+"$COMMON_CONFIG"} \
            ${ALIOTH_CONFIG:+"$ALIOTH_CONFIG"}

          # 5. Принудительно включаем параметры DroidSpaces и KernelSU
          chmod +x ./scripts/config
          ./scripts/config --file out/.config \
            --disable COMPAT_VDSO \
            --enable KSU \
            --enable SYSVIPC \
            --enable POSIX_MQUEUE \
            --enable NAMESPACES \
            --enable UTS_NS \
            --enable IPC_NS \
            --enable PID_NS \
            --enable NET_NS \
            --enable USER_NS \
            --enable CGROUPS \
            --enable CGROUP_PIDS \
            --enable CGROUP_DEVICE \
            --enable CGROUP_FREEZER \
            --enable CPUSETS \
            --enable DEVTMPFS \
            --enable DEVTMPFS_MOUNT \
            --enable VETH \
            --enable BRIDGE \
            --enable NETFILTER_XT_MATCH_ADDRTYPE

          # 6. Финализируем зависимости
          make O=out ARCH=arm64 olddefconfig


      - name: Compile Kernel Image
        run: |
          cd kernel
          export PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64
          
          make -j$(nproc) O=out \
            ARCH=arm64 \
            SUBARCH=arm64 \
            CC=clang \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            Image

      - name: Package with AnyKernel3
        run: |
          git clone https://github.com/osm0sis/AnyKernel3.git ak3
          cd ak3
          cp ../kernel/out/arch/arm64/boot/Image .

          # Настраиваем имена устройств для проверки
          sed -i 's/device.name1=.*/device.name1=alioth/' anykernel.sh
          sed -i 's/device.name2=.*/device.name2=aliothin/' anykernel.sh
          sed -i 's/device.name3=.*/device.name3=POCO F3/' anykernel.sh
          sed -i 's/device.name4=.*/device.name4=Redmi K40/' anykernel.sh

          # Задаем правильный блок boot и автоматическое определение A/B слотов
          sed -i 's|block=/dev/block/platform/omap/omap_hsmmc.0/by-name/boot;|block=boot;|' anykernel.sh
          sed -i 's/is_slot_device=0;/is_slot_device=auto;/' anykernel.sh

          # Собираем ZIP для рекавери
          zip -r9 ../AnyKernel3-Alioth-DroidSpaces-KSU.zip * -x .git README.md *placeholder

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AnyKernel3-Alioth-DroidSpaces-KSU
          path: AnyKernel3-Alioth-DroidSpaces-KSU.zip
